name: build-feed

on:
  schedule:
    - cron: "30 1,13 * * *"   # ~07:00 and ~19:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources.yaml"
      - "feed/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: write   # commit the refreshed data/items.json
  pages: write
  id-token: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m feed build

      - name: Commit refreshed data
        run: |
          git config user.name "feed-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "chore(data): refresh feed"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
