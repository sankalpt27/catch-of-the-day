name: test

on:
  push:
    branches: [main]
    paths: ["feed/**", "tests/**", "requirements*.txt"]
  pull_request:
    paths: ["feed/**", "tests/**", "requirements*.txt"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
